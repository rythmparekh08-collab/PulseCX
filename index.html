    }

    }

    /* ========================================================================= */
    /* ATMOSPHERIC GRADIENT WAVE KEYFRAMES (NATIVE RECREATION OF VIDEO) */
    /* ========================================================================= */
    @keyframes waveShift1 {
      0% { transform: translate3d(-3%, 0, 0) scaleY(1); }
      50% { transform: translate3d(3%, -16px, 0) scaleY(1.08); }
      100% { transform: translate3d(-3%, 0, 0) scaleY(1); }
    }

    @keyframes waveShift2 {
      0% { transform: translate3d(4%, 0, 0) scaleY(1.05); }
      50% { transform: translate3d(-3%, -20px, 0) scaleY(0.94); }
      100% { transform: translate3d(4%, 0, 0) scaleY(1.05); }
    }

    @keyframes waveShift3 {
      0% { transform: translate3d(-2%, 0, 0) scale(1); }
      50% { transform: translate3d(4%, -12px, 0) scale(1.06); }
      100% { transform: translate3d(-2%, 0, 0) scale(1); }
    }

    .bg-wave-layer-1 {
      animation: waveShift1 26s cubic-bezier(0.445, 0.05, 0.55, 0.95) infinite;
      will-change: transform;
    }
    .bg-wave-layer-2 {
      animation: waveShift2 32s cubic-bezier(0.445, 0.05, 0.55, 0.95) infinite;
      will-change: transform;
    }
    .bg-wave-layer-3 {
      animation: waveShift3 22s cubic-bezier(0.445, 0.05, 0.55, 0.95) infinite;
      will-change: transform;
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-wave-layer-1,
      .bg-wave-layer-2,
      .bg-wave-layer-3 {
        animation: none !important;
      }
    }

    // =========================================================================

    // =========================================================================
    // REACTIVE FLUID FLOWING GRADIENT WAVE COMPONENT (HIGH SPEED & INTERACTIVE)
    // Fast flowing liquid plasma waves with responsive cursor swell, wake & ripples
    // =========================================================================
    function ReactiveFluidWave() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        let mouse = {
          x: width * 0.5,
          y: height * 0.8,
          targetX: width * 0.5,
          targetY: height * 0.8,
          vx: 0,
          vy: 0,
          prevX: width * 0.5,
          speed: 0,
          active: true
        };

        // Interactive ripple shockwaves spawned on movement and click
        let ripples = [];

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };

        const handleMouseMove = (e) => {
          mouse.targetX = e.clientX;
          mouse.targetY = e.clientY;
          mouse.active = true;

          // Spawn fluid ripples on significant movement
          if (Math.hypot(e.clientX - mouse.prevX, e.clientY - mouse.y) > 25 && ripples.length < 12) {
            ripples.push({
              x: e.clientX,
              radius: 5,
              maxRadius: width * 0.35,
              amplitude: 35,
              speed: 9
            });
          }
        };

        const handleMouseDown = (e) => {
          ripples.push({
            x: e.clientX,
            radius: 8,
            maxRadius: width * 0.45,
            amplitude: 60,
            speed: 12
          });
        };

        const handleTouchMove = (e) => {
          if (e.touches && e.touches[0]) {
            mouse.targetX = e.touches[0].clientX;
            mouse.targetY = e.touches[0].clientY;
            mouse.active = true;
          }
        };

        window.addEventListener('resize', handleResize);
        window.addEventListener('mousemove', handleMouseMove, { passive: true });
        window.addEventListener('mousedown', handleMouseDown, { passive: true });
        window.addEventListener('touchmove', handleTouchMove, { passive: true });

        let t = 0;

        const render = () => {
          // FAST FLOW SPEED (Over 3.5x faster for visible, churning, energetic flow)
          t += 0.052;

          // Responsive lerp tracking (quick response to mouse)
          mouse.x += (mouse.targetX - mouse.x) * 0.12;
          mouse.y += (mouse.targetY - mouse.y) * 0.12;

          // Calculate mouse velocity & kinetic energy
          mouse.vx = mouse.x - mouse.prevX;
          mouse.prevX = mouse.x;
          mouse.speed = Math.abs(mouse.vx);

          // Update active ripples
          for (let i = ripples.length - 1; i >= 0; i--) {
            const r = ripples[i];
            r.radius += r.speed;
            r.amplitude *= 0.94; // fade out
            if (r.radius > r.maxRadius || r.amplitude < 0.8) {
              ripples.splice(i, 1);
            }
          }

          ctx.clearRect(0, 0, width, height);

          // Base vertical origin of wave (lower ~32% of screen)
          const baseY = height * 0.72;

          // Proximity & normalized cursor position
          const mouseNormX = (mouse.x / width) - 0.5; // -0.5 to 0.5
          const mouseProximity = Math.max(0.15, Math.min(1.2, 1 - (mouse.y / height) * 0.6));
          const velocitySurge = Math.min(50, mouse.speed * 2.2);

          // Helper to calculate ripple displacements at coordinate x
          const getRippleOffset = (x) => {
            let offset = 0;
            for (let i = 0; i < ripples.length; i++) {
              const r = ripples[i];
              const dist = Math.abs(x - r.x);
              const wavePhase = (dist - r.radius) * 0.045;
              if (dist < r.radius + 80 && dist > r.radius - 80) {
                offset += Math.sin(wavePhase) * r.amplitude * Math.exp(-Math.abs(dist - r.radius) * 0.03);
              }
            }
            return offset;
          };

          // ===================================================================
          // LAYER 1: Vivid Electric Cyan & Deep Royal Blue (Fast Wave)
          // ===================================================================
          {
            const grad1 = ctx.createLinearGradient(0, height * 0.58, width, height);
            grad1.addColorStop(0, '#00F0FF'); // Electric Cyan
            grad1.addColorStop(0.24, '#1E40FF'); // Deep Cobalt Blue
            grad1.addColorStop(0.58, '#315DFF'); // Royal Blue
            grad1.addColorStop(0.84, '#7047FF'); // Electric Purple
            grad1.addColorStop(1, '#00F0FF');

            ctx.fillStyle = grad1;
            ctx.beginPath();
            ctx.moveTo(-60, height);

            const step = 14;
            for (let x = -60; x <= width + 60; x += step) {
              // High-amplitude, high-speed multi-frequency harmonic flow
              const flow1 = Math.sin(x * 0.0028 + t * 1.6) * 58;
              const flow2 = Math.cos(x * 0.0048 - t * 1.2) * 38;
              const flow3 = Math.sin(x * 0.0016 + t * 2.1) * 24;

              // Dramatic Gaussian suction/swell toward cursor
              const distToMouse = Math.abs(x - mouse.x);
              const cursorSwell = Math.exp(-(distToMouse * distToMouse) / (width * width * 0.038)) * (85 * mouseProximity + velocitySurge);
              const cursorWakeTilt = mouseNormX * (x - width * 0.5) * 0.09;
              const rippleDisp = getRippleOffset(x);

              const y = baseY + flow1 + flow2 + flow3 - cursorSwell + cursorWakeTilt + rippleDisp;

              ctx.lineTo(x, y);
            }

            ctx.lineTo(width + 60, height);
            ctx.closePath();
            ctx.fill();
          }

          // ===================================================================
          // LAYER 2: Radiant Magenta, Violet & Hot Pink (Fast Offset Crest)
          // ===================================================================
          {
            const grad2 = ctx.createLinearGradient(0, height * 0.62, width, height);
            grad2.addColorStop(0.02, '#1E40FF');
            grad2.addColorStop(0.28, '#8A2BE2'); // Radiant Violet
            grad2.addColorStop(0.62, '#E024C3'); // Hot Magenta
            grad2.addColorStop(0.85, '#FF3B94'); // Bright Neon Pink
            grad2.addColorStop(1, '#7047FF');

            ctx.fillStyle = grad2;
            ctx.beginPath();
            ctx.moveTo(-60, height);

            const step = 14;
            for (let x = -60; x <= width + 60; x += step) {
              const flow1 = Math.cos(x * 0.0034 - t * 1.45) * 50;
              const flow2 = Math.sin(x * 0.0056 + t * 1.8) * 34;

              const distToMouse = Math.abs(x - mouse.x);
              const cursorSwell = Math.exp(-(distToMouse * distToMouse) / (width * width * 0.032)) * (75 * mouseProximity + velocitySurge * 0.8);
              const cursorWakeTilt = -mouseNormX * (x - width * 0.5) * 0.07;
              const rippleDisp = getRippleOffset(x) * 1.15;

              const y = (baseY + 36) + flow1 + flow2 - cursorSwell + cursorWakeTilt + rippleDisp;

              ctx.lineTo(x, y);
            }

            ctx.lineTo(width + 60, height);
            ctx.closePath();
            ctx.fill();
          }

          // ===================================================================
          // LAYER 3: Sunset Amber, Golden Glow & Peach Wave (Dynamic Highlights)
          // ===================================================================
          {
            const grad3 = ctx.createLinearGradient(0, height * 0.68, width, height);
            grad3.addColorStop(0.06, 'rgba(0, 240, 255, 0.65)');
            grad3.addColorStop(0.35, 'rgba(138, 43, 226, 0.8)');
            grad3.addColorStop(0.65, 'rgba(255, 170, 0, 0.95)'); // Glowing Sunset Amber/Gold
            grad3.addColorStop(0.85, 'rgba(255, 59, 148, 0.85)'); // Hot Pink
            grad3.addColorStop(1, 'rgba(30, 64, 255, 0.7)');

            ctx.fillStyle = grad3;
            ctx.beginPath();
            ctx.moveTo(-60, height);

            const step = 14;
            for (let x = -60; x <= width + 60; x += step) {
              const flow1 = Math.sin(x * 0.0042 + t * 2.2) * 44;
              const flow2 = Math.cos(x * 0.0068 - t * 1.3) * 28;

              const distToMouse = Math.abs(x - mouse.x);
              const cursorSwell = Math.exp(-(distToMouse * distToMouse) / (width * width * 0.024)) * (65 * mouseProximity);
              const rippleDisp = getRippleOffset(x) * 0.85;

              const y = (baseY + 68) + flow1 + flow2 - cursorSwell + rippleDisp;

              ctx.lineTo(x, y);
            }

            ctx.lineTo(width + 60, height);
            ctx.closePath();
            ctx.fill();
          }

          // ===================================================================
          // LAYER 4: Interactive Reactive Cursor Plasma Bloom
          // ===================================================================
          if (mouse.active) {
            const bloomY = Math.max(height * 0.72, Math.min(height * 0.98, mouse.y));
            const bloomRadius = Math.max(width * 0.18, 180 + mouse.speed * 5);
            
            const bloomGrad = ctx.createRadialGradient(
              mouse.x, bloomY, 10,
              mouse.x, bloomY, bloomRadius
            );
            bloomGrad.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
            bloomGrad.addColorStop(0.18, 'rgba(255, 170, 0, 0.5)'); // Golden core
            bloomGrad.addColorStop(0.45, 'rgba(224, 36, 195, 0.4)'); // Magenta halo
            bloomGrad.addColorStop(0.75, 'rgba(0, 240, 255, 0.25)'); // Cyan rim
            bloomGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = bloomGrad;
            ctx.beginPath();
            ctx.arc(mouse.x, bloomY, bloomRadius, 0, Math.PI * 2);
            ctx.fill();
          }

          animationFrameId = requestAnimationFrame(render);
        };

        animationFrameId = requestAnimationFrame(render);

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mousedown', handleMouseDown);
          window.removeEventListener('touchmove', handleTouchMove);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <div className="fixed inset-0 pointer-events-none overflow-hidden z-0 select-none bg-[#050608]">
          {/* Top Vignette Overlay: Keeps upper 65-70% deep black, smoothly transitioning */}
          <div 
            className="absolute inset-0 z-10 pointer-events-none"
            style={{
              background: 'linear-gradient(180deg, #050608 0%, #050608 45%, rgba(5,6,8,0.85) 68%, rgba(5,6,8,0.12) 100%)'
            }}
          />

          {/* Dynamic Flowing Reactive Canvas Wave (Sharper blur & higher opacity for vivid visual interest) */}
          <canvas
            ref={canvasRef}
            className="absolute inset-0 w-full h-full pointer-events-none"
            style={{
              filter: 'blur(48px)',
              opacity: 0.88,
              transform: 'translate3d(0, 0, 0)',
            }}
          />
        </div>
      );
    }

    function ServiceManagerDeskPlatform({ customer, ticketRef, initialText, onOpenAuth }) {
      const [messages, setMessages] = useState([
        { id: 1, sender: 'manager', text: `Hello ${customer ? customer.firstName : 'there'}! I am Marcus Vance, your assigned Senior Service Manager. How can I assist you with your active shipment, warranty replacement, or billing today?`, timestamp: 'Just now' }
      ]);
      const [inputText, setInputText] = useState(initialText || '');
      const [isCalling, setIsCalling] = useState(false);
      const [callDuration, setCallDuration] = useState(0);
      const [callbackSuccess, setCallbackSuccess] = useState(false);

      useEffect(() => {
        if (initialText) setInputText(initialText);
      }, [initialText]);

      useEffect(() => {
        let timer;
        if (isCalling) {
          timer = setInterval(() => setCallDuration(d => d + 1), 1000);
        } else {
          setCallDuration(0);
        }
        return () => clearInterval(timer);
      }, [isCalling]);

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!inputText.trim()) return;

        const userMsg = { id: Date.now(), sender: 'user', text: inputText, timestamp: 'Just now' };
        setMessages(prev => [...prev, userMsg]);
        const submitted = inputText;
        setInputText('');

        setTimeout(() => {
          let reply = "Thank you for the update. I have pulled up your account records and verified the details on the dispatch terminal. Let me handle this right away for you.";
          if (submitted.toLowerCase().includes('track') || submitted.toLowerCase().includes('where') || submitted.toLowerCase().includes('shipment')) {
            reply = "I've checked the live courier telemetry. Shipment AT-9842 is currently 3.8 miles away with driver Carlos Martinez (FedEx Van #14) and remains on schedule for delivery today by 4:30 PM EST.";
          } else if (submitted.toLowerCase().includes('refund') || submitted.toLowerCase().includes('return') || submitted.toLowerCase().includes('money')) {
            reply = "Under our 30-day Risk-Free Guarantee, your order ORD-2026-9842 is 100% eligible for an immediate full refund. I have generated a prepaid return label on your account hub.";
          } else if (submitted.toLowerCase().includes('warranty') || submitted.toLowerCase().includes('broken') || submitted.toLowerCase().includes('replace')) {
            reply = "Your hardware warranty is active and valid until August 2028. I can dispatch an advance replacement unit to your doorstep immediately without requiring you to return the original first.";
          }
          setMessages(prev => [...prev, { id: Date.now() + 1, sender: 'manager', text: reply, timestamp: 'Just now' }]);
        }, 800);
      };

      const formatCallTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      };

      return (
        <div className="space-y-6 animate-fadeIn">
          
          {/* Executive Header Card */}
          <div className="saas-card p-6 bg-[#101318] flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div className="flex items-center gap-4">

              <div className="space-y-1">
                <div className="flex items-center gap-2">
                  <h2 className="text-xl font-bold text-[#F5F7FA]">Marcus Vance</h2>
                  <span className="inline-flex items-center gap-1 text-[10px] font-semibold text-emerald-400 bg-emerald-950/40 border border-emerald-800/50 px-2 py-0.5 rounded">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    Available on Desk
                  </span>
                </div>
                <div className="text-xs text-[#8B939C]">
                  Senior Executive Service Manager • Direct Extension: <strong className="text-[#E8EBEF] font-mono">401</strong>
                </div>
                <div className="text-xs text-[#8B939C]">
                  Ticket Ref: <strong className="text-[#E8EBEF] font-mono">{ticketRef}</strong>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2.5 flex-wrap">
              <button
                onClick={() => setIsCalling(true)}
                className="saas-btn-primary text-xs px-3.5 py-2 flex items-center gap-2"
              >
                <Icons.Phone className="w-3.5 h-3.5" />
                <span>Call Executive Desk</span>
              </button>
              <button
                onClick={() => { setCallbackSuccess(true); setTimeout(() => setCallbackSuccess(false), 3000); }}
                className="saas-btn-secondary text-xs px-3.5 py-2"
              >
                {callbackSuccess ? 'Callback Scheduled!' : 'Request 10-Min Callback'}
              </button>
            </div>
          </div>

          {/* Interactive Chat Workspace */}
          <div className="saas-card bg-[#101318] overflow-hidden flex flex-col h-[520px]">
            <div className="p-4 border-b border-[#242A31] flex items-center justify-between bg-[#080A0D]">
              <div className="flex items-center gap-2 text-xs">
                <Icons.MessageSquare className="w-4 h-4 text-[#8B939C]" />
                <span className="font-semibold text-[#F5F7FA]">Direct Service Communication Terminal</span>
              </div>
              <span className="text-[11px] text-[#8B939C] font-mono">End-to-End Encrypted</span>
            </div>

            {/* Messages Thread */}
            <div className="flex-1 p-4 sm:p-6 overflow-y-auto space-y-4 bg-[#101318]">
              {messages.map(m => (
                <div key={m.id} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                  <div className={`max-w-md p-3.5 rounded-xl text-xs space-y-1 ${
                    m.sender === 'user'
                      ? 'bg-[#F1F3F5] text-[#090B0D] font-medium'
                      : 'bg-[#14181D] text-[#F5F7FA] border border-[#242A31]'
                  }`}>
                    <div className="flex items-center justify-between gap-4 text-[10px] opacity-75">
                      <span className="font-semibold">{m.sender === 'user' ? (customer?.firstName || 'You') : 'Marcus Vance'}</span>

                    </div>
                    <p className="leading-relaxed">{m.text}</p>
                  </div>
                </div>
              ))}
            </div>

            {/* Input Form */}
            <form onSubmit={handleSendMessage} className="p-3 border-t border-[#242A31] bg-[#080A0D] flex items-center gap-2">
              <input
                type="text"
                value={inputText}
                onChange={(e) => setInputText(e.target.value)}
                placeholder="Type your question or request to Marcus Vance..."
                className="flex-1 saas-input px-3.5 py-2 text-xs text-[#F5F7FA]"
              />
              <button
                type="submit"
                className="saas-btn-primary px-4 py-2 text-xs flex items-center gap-1.5"
              >
                <span>Send</span>
                <Icons.Send className="w-3.5 h-3.5" />
              </button>
            </form>
          </div>

          {/* Voice Call Modal */}
          {isCalling && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn">
              <div className="saas-card p-6 bg-[#101318] border border-[#242A31] max-w-sm w-full text-center space-y-4 shadow-modal">
                <div className="w-16 h-16 rounded-full bg-[#14181D] border border-[#242A31] text-[#F5F7FA] font-bold text-xl flex items-center justify-center mx-auto shadow-card">
                  MV
                </div>
                <div>
                  <h3 className="text-base font-bold text-[#F5F7FA]">Marcus Vance</h3>
                  <div className="text-xs text-[#8B939C]">Senior Service Manager Desk</div>
                  <div className="text-xs font-mono font-bold text-[#F5F7FA] mt-2">{formatCallTime(callDuration)}</div>
                </div>

                <div className="flex items-center justify-center gap-1 py-3">
                  {[12, 24, 38, 20, 42, 16, 30, 45, 22, 14].map((h, i) => (
                    <div 
                      key={i} 
                      className="w-1 bg-[#B6C2CC] rounded-full transition-all duration-150" 
                      style={{ height: `${h}px` }} 
                    />
                  ))}
                </div>

                <div className="text-xs text-[#8B939C]">Channel: HD Enterprise VoIP Secure</div>

                <button
                  onClick={() => setIsCalling(false)}
                  className="w-full bg-red-600 hover:bg-red-700 text-white font-medium text-xs py-2.5 rounded-lg transition"
                >
                  End Call
                </button>
              </div>
            </div>
          )}

        </div>
      );

                  <div className="flex justify-between">
                    <span>Subtotal:</span>
                    <strong className="text-[#F5F7FA]">$349.00</strong>
                  </div>

                    <span>Shipping:</span>
                    <strong className="text-[#F5F7FA]">$0.00 (Free FedEx Express)</strong>
                  </div>
                  <div className="flex justify-between">

                    <strong className="text-[#F5F7FA]">$0.00</strong>

    // =========================================================================
    // SECTION 5: SERVICE POLICIES SECTION
    // =========================================================================
    function PolicySection({ onAskNova, onTextServiceManager }) {
      return (
        <div className="saas-card p-6 sm:p-8 bg-[#101318] space-y-6 animate-fadeIn">
          <div className="space-y-1">
            <h2 className="text-2xl font-bold text-[#F5F7FA]">PulseCX Customer Charter & Policies</h2>

    // =========================================================================
    // SECTION 6: NOVA AI ASSISTANT WIDGET
    // Floating button: background #F1F3F5, text #090B0D, 10px radius, subtle shadow
    // =========================================================================
    function NovaAssistantWidget({ customer, externalPrompt, onClearExternalPrompt, onSwitchToManager, onOpenAuth }) {
      const [isOpen, setIsOpen] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        { id: 1, sender: 'nova', text: "Hello! I am Nova, your AI assistant. Ask me about shipment tracking, warranty coverage, or return labels.", timestamp: 'Just now' }
      ]);
      const [chatInput, setChatInput] = useState('');

      useEffect(() => {
        if (externalPrompt) {
          setIsOpen(true);
          handleSendPrompt(externalPrompt);
          onClearExternalPrompt();
        }
      }, [externalPrompt]);

      const handleSendPrompt = (text) => {
        if (!text.trim()) return;
        const userMsg = { id: Date.now(), sender: 'user', text, timestamp: 'Just now' };
        setChatMessages(prev => [...prev, userMsg]);
        setChatInput('');

        setTimeout(() => {
          let botReply = "I have queried the logistics database. Your shipment AT-9842 is currently in transit with FedEx and will arrive today by 4:30 PM EST.";
          if (text.toLowerCase().includes('return') || text.toLowerCase().includes('refund')) {
            botReply = "All PulseCX purchases include a 30-day 100% money-back guarantee. You can print a free prepaid shipping label directly from your account hub.";
          } else if (text.toLowerCase().includes('manager') || text.toLowerCase().includes('human') || text.toLowerCase().includes('marcus')) {
            botReply = "I can transfer this conversation directly to Marcus Vance (Senior Service Manager Desk). Click below to connect.";
          }
          setChatMessages(prev => [...prev, { id: Date.now() + 1, sender: 'nova', text: botReply, timestamp: 'Just now' }]);
        }, 700);
      };

      return (
        <>
          {/* Floating Pill Button (#F1F3F5 background, #090B0D text, 10px rounded, no emoji) */}
          <button
            onClick={() => setIsOpen(!isOpen)}
            className="fixed bottom-5 right-5 z-40 bg-[#F1F3F5] text-[#090B0D] hover:bg-white px-4 py-2.5 rounded-[10px] shadow-dropdown flex items-center gap-2 text-xs font-semibold hover:scale-105 transition-all"
            aria-label="Open Nova Assistant"
          >
            <Icons.Sparkles className="w-4 h-4 text-[#090B0D]" />
            <span>Nova Assistant</span>
          </button>

          {/* Assistant Modal Window (Dark Mode) */}
          {isOpen && (
            <div className="fixed bottom-20 right-5 w-80 sm:w-96 saas-card bg-[#101318] border border-[#242A31] shadow-modal z-50 flex flex-col h-[480px] overflow-hidden animate-fadeIn">
              <div className="p-3.5 border-b border-[#242A31] flex items-center justify-between bg-[#080A0D]">
                <div className="flex items-center gap-2">
                  <div className="w-6 h-6 rounded-md bg-[#14181D] border border-[#242A31] text-[#F5F7FA] flex items-center justify-center">
                    <Icons.Sparkles className="w-3.5 h-3.5" />
                  </div>
                  <span className="text-xs font-bold text-[#F5F7FA]">Nova AI Assistant</span>
                </div>
                <button onClick={() => setIsOpen(false)} className="text-[#8B939C] hover:text-[#F5F7FA]">
                  <Icons.X className="w-4 h-4" />
                </button>
              </div>

              {/* Chat Thread */}
              <div className="flex-1 p-4 overflow-y-auto space-y-3 bg-[#101318]">
                {chatMessages.map(m => (
                  <div key={m.id} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[85%] p-3 rounded-xl text-xs space-y-1 ${
                      m.sender === 'user'
                        ? 'bg-[#F1F3F5] text-[#090B0D] font-medium'
                        : 'bg-[#14181D] text-[#F5F7FA] border border-[#242A31]'
                    }`}>
                      <p className="leading-relaxed">{m.text}</p>
                    </div>
                  </div>
                ))}
              </div>

              {/* Quick Actions */}
              <div className="p-2 border-t border-[#242A31] bg-[#080A0D] flex gap-1.5 overflow-x-auto">
                <button
                  onClick={() => handleSendPrompt("Where is my shipment AT-9842?")}
                  className="text-[10px] font-medium text-[#8B939C] bg-[#14181D] border border-[#242A31] px-2 py-1 rounded shrink-0 hover:text-[#F5F7FA] hover:bg-[#171B20]"
                >
                  Track AT-9842
                </button>
                <button
                  onClick={() => handleSendPrompt("How do I return a product?")}
                  className="text-[10px] font-medium text-[#8B939C] bg-[#14181D] border border-[#242A31] px-2 py-1 rounded shrink-0 hover:text-[#F5F7FA] hover:bg-[#171B20]"
                >
                  Return Policy
                </button>
                <button
                  onClick={() => onSwitchToManager("Assistance from Nova AI")}
                  className="text-[10px] font-medium text-[#8B939C] bg-[#14181D] border border-[#242A31] px-2 py-1 rounded shrink-0 hover:text-[#F5F7FA] hover:bg-[#171B20]"
                >
                  Talk to Marcus
                </button>
              </div>

              {/* Input Form */}
              <form 
                onSubmit={(e) => { e.preventDefault(); handleSendPrompt(chatInput); }}
                className="p-3 border-t border-[#242A31] flex items-center gap-2 bg-[#080A0D]"
              >
                <input
                  type="text"
                  value={chatInput}
                  onChange={(e) => setChatInput(e.target.value)}
                  placeholder="Ask Nova a question..."
                  className="flex-1 saas-input px-3 py-1.5 text-xs text-[#F5F7FA]"
                />
                <button type="submit" className="saas-btn-primary p-2">
                  <Icons.Send className="w-3.5 h-3.5" />
                </button>
              </form>
            </div>
          )}
        </>
      );
    }

    // Render React Application to Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
