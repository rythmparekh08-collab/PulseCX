      50% { transform: translate3d(3%, -16px, 0) scaleY(1.08); }
      100% { transform: translate3d(-3%, 0, 0) scaleY(1); }

    @keyframes waveShift2 {
      0% { transform: translate3d(4%, 0, 0) scaleY(1.05); }
      50% { transform: translate3d(-3%, -20px, 0) scaleY(0.94); }
      100% { transform: translate3d(4%, 0, 0) scaleY(1.05); }

    @keyframes waveShift3 {
      0% { transform: translate3d(-2%, 0, 0) scale(1); }
      50% { transform: translate3d(4%, -12px, 0) scale(1.06); }
      100% { transform: translate3d(-2%, 0, 0) scale(1); }

    .bg-wave-layer-2 {

    .bg-wave-layer-3 {

    @media (prefers-reduced-motion: reduce) {

    // REACTIVE FLUID FLOWING GRADIENT WAVE COMPONENT (HIGH SPEED & INTERACTIVE)
    // Fast flowing liquid plasma waves with responsive cursor swell, wake & ripples
    // =========================================================================
    function ReactiveFluidWave() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        let mouse = {
          x: width * 0.5,
          y: height * 0.8,
          targetX: width * 0.5,
          targetY: height * 0.8,
          vx: 0,
          vy: 0,
          prevX: width * 0.5,
          speed: 0,
          active: true
        };

        let ripples = [];

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };

        const handleMouseMove = (e) => {
          mouse.targetX = e.clientX;
          mouse.targetY = e.clientY;
          mouse.active = true;

          if (Math.hypot(e.clientX - mouse.prevX, e.clientY - mouse.y) > 25 && ripples.length < 12) {
            ripples.push({
              x: e.clientX,
              radius: 5,
              maxRadius: width * 0.35,
              amplitude: 35,
              speed: 9
            });
          }
        };

        const handleMouseDown = (e) => {
          ripples.push({
            x: e.clientX,
            radius: 8,
            maxRadius: width * 0.45,
            amplitude: 60,
            speed: 12
          });
        };

        const handleTouchMove = (e) => {
          if (e.touches && e.touches[0]) {
            mouse.targetX = e.touches[0].clientX;
            mouse.targetY = e.touches[0].clientY;
            mouse.active = true;
          }
        };

        window.addEventListener('resize', handleResize);
        window.addEventListener('mousemove', handleMouseMove, { passive: true });
        window.addEventListener('mousedown', handleMouseDown, { passive: true });
        window.addEventListener('touchmove', handleTouchMove, { passive: true });

        let t = 0;

        const render = () => {
          t += 0.052;

          mouse.x += (mouse.targetX - mouse.x) * 0.12;
          mouse.y += (mouse.targetY - mouse.y) * 0.12;

          mouse.vx = mouse.x - mouse.prevX;
          mouse.prevX = mouse.x;
          mouse.speed = Math.abs(mouse.vx);

          for (let i = ripples.length - 1; i >= 0; i--) {
            const r = ripples[i];
            r.radius += r.speed;
            r.amplitude *= 0.94;
            if (r.radius > r.maxRadius || r.amplitude < 0.8) {
              ripples.splice(i, 1);
            }
          }

          ctx.clearRect(0, 0, width, height);

          const baseY = height * 0.72;
          const mouseNormX = (mouse.x / width) - 0.5;
          const mouseProximity = Math.max(0.15, Math.min(1.2, 1 - (mouse.y / height) * 0.6));
          const velocitySurge = Math.min(50, mouse.speed * 2.2);

          const getRippleOffset = (x) => {
            let offset = 0;
            for (let i = 0; i < ripples.length; i++) {
              const r = ripples[i];
              const dist = Math.abs(x - r.x);
              const wavePhase = (dist - r.radius) * 0.045;
              if (dist < r.radius + 80 && dist > r.radius - 80) {
                offset += Math.sin(wavePhase) * r.amplitude * Math.exp(-Math.abs(dist - r.radius) * 0.03);
              }
            }
            return offset;
          };

          // LAYER 1: Vivid Electric Cyan & Deep Royal Blue (Fast Wave)
          {
            const grad1 = ctx.createLinearGradient(0, height * 0.58, width, height);
            grad1.addColorStop(0, '#00F0FF');
            grad1.addColorStop(0.24, '#1E40FF');
            grad1.addColorStop(0.58, '#315DFF');
            grad1.addColorStop(0.84, '#7047FF');
            grad1.addColorStop(1, '#00F0FF');

            ctx.fillStyle = grad1;
            ctx.beginPath();
            ctx.moveTo(-60, height);

            const step = 14;
            for (let x = -60; x <= width + 60; x += step) {
              const flow1 = Math.sin(x * 0.0028 + t * 1.6) * 58;
              const flow2 = Math.cos(x * 0.0048 - t * 1.2) * 38;
              const flow3 = Math.sin(x * 0.0016 + t * 2.1) * 24;

              const distToMouse = Math.abs(x - mouse.x);
              const cursorSwell = Math.exp(-(distToMouse * distToMouse) / (width * width * 0.038)) * (85 * mouseProximity + velocitySurge);
              const cursorWakeTilt = mouseNormX * (x - width * 0.5) * 0.09;
              const rippleDisp = getRippleOffset(x);

              const y = baseY + flow1 + flow2 + flow3 - cursorSwell + cursorWakeTilt + rippleDisp;
              ctx.lineTo(x, y);
            }

            ctx.lineTo(width + 60, height);
            ctx.closePath();
            ctx.fill();
          }

          // LAYER 2: Radiant Magenta, Violet & Hot Pink
          {
            const grad2 = ctx.createLinearGradient(0, height * 0.62, width, height);
            grad2.addColorStop(0.02, '#1E40FF');
            grad2.addColorStop(0.28, '#8A2BE2');
            grad2.addColorStop(0.62, '#E024C3');
            grad2.addColorStop(0.85, '#FF3B94');
            grad2.addColorStop(1, '#7047FF');

            ctx.fillStyle = grad2;
            ctx.beginPath();
            ctx.moveTo(-60, height);

            const step = 14;
            for (let x = -60; x <= width + 60; x += step) {
              const flow1 = Math.cos(x * 0.0034 - t * 1.45) * 50;
              const flow2 = Math.sin(x * 0.0056 + t * 1.8) * 34;

              const distToMouse = Math.abs(x - mouse.x);
              const cursorSwell = Math.exp(-(distToMouse * distToMouse) / (width * width * 0.032)) * (75 * mouseProximity + velocitySurge * 0.8);
              const cursorWakeTilt = -mouseNormX * (x - width * 0.5) * 0.07;
              const rippleDisp = getRippleOffset(x) * 1.15;

              const y = (baseY + 36) + flow1 + flow2 - cursorSwell + cursorWakeTilt + rippleDisp;
              ctx.lineTo(x, y);
            }

            ctx.lineTo(width + 60, height);
            ctx.closePath();
            ctx.fill();
          }

          // LAYER 3: Sunset Amber & Golden Glow
          {
            const grad3 = ctx.createLinearGradient(0, height * 0.68, width, height);
            grad3.addColorStop(0.06, 'rgba(0, 240, 255, 0.65)');
            grad3.addColorStop(0.35, 'rgba(138, 43, 226, 0.8)');
            grad3.addColorStop(0.65, 'rgba(255, 170, 0, 0.95)');
            grad3.addColorStop(0.85, 'rgba(255, 59, 148, 0.85)');
            grad3.addColorStop(1, 'rgba(30, 64, 255, 0.7)');

            ctx.fillStyle = grad3;
            ctx.beginPath();
            ctx.moveTo(-60, height);

            const step = 14;
            for (let x = -60; x <= width + 60; x += step) {
              const flow1 = Math.sin(x * 0.0042 + t * 2.2) * 44;
              const flow2 = Math.cos(x * 0.0068 - t * 1.3) * 28;

              const distToMouse = Math.abs(x - mouse.x);
              const cursorSwell = Math.exp(-(distToMouse * distToMouse) / (width * width * 0.024)) * (65 * mouseProximity);
              const rippleDisp = getRippleOffset(x) * 0.85;

              const y = (baseY + 68) + flow1 + flow2 - cursorSwell + rippleDisp;
              ctx.lineTo(x, y);
            }

            ctx.lineTo(width + 60, height);
            ctx.closePath();
            ctx.fill();
          }

          // LAYER 4: Interactive Reactive Cursor Plasma Bloom
          if (mouse.active) {
            const bloomY = Math.max(height * 0.72, Math.min(height * 0.98, mouse.y));
            const bloomRadius = Math.max(width * 0.18, 180 + mouse.speed * 5);
            
            const bloomGrad = ctx.createRadialGradient(
              mouse.x, bloomY, 10,
              mouse.x, bloomY, bloomRadius
            );
            bloomGrad.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
            bloomGrad.addColorStop(0.18, 'rgba(255, 170, 0, 0.5)');
            bloomGrad.addColorStop(0.45, 'rgba(224, 36, 195, 0.4)');
            bloomGrad.addColorStop(0.75, 'rgba(0, 240, 255, 0.25)');
            bloomGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = bloomGrad;
            ctx.beginPath();
            ctx.arc(mouse.x, bloomY, bloomRadius, 0, Math.PI * 2);
            ctx.fill();
          }

          animationFrameId = requestAnimationFrame(render);
        };

        animationFrameId = requestAnimationFrame(render);

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mousedown', handleMouseDown);
          window.removeEventListener('touchmove', handleTouchMove);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <div className="fixed inset-0 pointer-events-none overflow-hidden z-0 select-none bg-[#050608]">
          <div 
            className="absolute inset-0 z-10 pointer-events-none"
            style={{
              background: 'linear-gradient(180deg, #050608 0%, #050608 45%, rgba(5,6,8,0.85) 68%, rgba(5,6,8,0.12) 100%)'
            }}
          />

          <canvas
            ref={canvasRef}
            className="absolute inset-0 w-full h-full pointer-events-none"
            style={{
              filter: 'blur(48px)',
              opacity: 0.88,
              transform: 'translate3d(0, 0, 0)',
            }}
          />
        </div>
      );
    }

            <div className="w-full max-w-md saas-card p-8 bg-[#101318] border border-[#242A31] space-y-6 animate-fadeIn shadow-card relative z-10">
              
              <div className="text-center space-y-2">
                <div className="w-12 h-12 rounded-xl bg-[#14181D] border border-[#242A31] text-white flex items-center justify-center font-bold text-xl mx-auto shadow-subtle">
                  P
                </div>
                <h1 className="text-xl font-bold text-[#F5F7FA]">PulseCX Staff Console</h1>
                <p className="text-xs text-[#8B939C]">
                  Executive Service Desk & Logistics Telemetry Access
                </p>
              </div>

              {loginError && (
                <div className="p-3 rounded-lg bg-red-950/40 border border-red-800/50 text-xs text-red-300">
                  {loginError}
                </div>
              )}

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="text-xs font-semibold text-[#8B939C] block mb-1">Staff Username</label>
                  <input
                    type="text"
                    required
                    value={loginUser}
                    onChange={(e) => setLoginUser(e.target.value)}
                    placeholder="marcus.vance"
                    className="w-full saas-input px-3.5 py-2.5 text-xs text-[#F5F7FA]"
                  />
                </div>

                <div>
                  <label className="text-xs font-semibold text-[#8B939C] block mb-1">Security PIN / Password</label>
                  <input
                    type="password"
                    required
                    value={loginPin}
                    onChange={(e) => setLoginPin(e.target.value)}
                    placeholder="8842"
                    className="w-full saas-input px-3.5 py-2.5 text-xs text-[#F5F7FA]"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full saas-btn-primary py-2.5 text-xs font-semibold"
                >
                  Authenticate Desk Session
                </button>
              </form>

              <div className="pt-4 border-t border-[#242A31] flex items-center justify-between text-xs text-[#8B939C]">
                <a href="/" className="hover:text-white flex items-center gap-1">
                  <Icons.ArrowLeft className="w-3.5 h-3.5" />
                  <span>Customer Workspace</span>
                </a>
                <span className="font-mono text-[11px]">Default: marcus.vance / 8842</span>
              </div>

            </div>

          </div>
        );
      }

      // 2. AUTHENTICATED EXECUTIVE STAFF CONSOLE
      return (
        <div className="relative min-h-screen bg-[#050608] flex flex-col font-sans">
          <ReactiveFluidWave />

          {/* Top Admin Navigation Command Bar */}
          <header className="sticky top-0 z-30 bg-[rgba(6,8,10,0.88)] backdrop-blur-[16px] border-b border-[rgba(255,255,255,0.06)] px-6 py-3.5 flex items-center justify-between shadow-subtle relative z-20">
            <div className="flex items-center gap-3">
              <a href="/" className="w-8 h-8 rounded-lg bg-[#14181D] border border-[#242A31] text-white flex items-center justify-center font-bold text-sm">
                P
              </a>
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-bold text-sm text-[#F5F7FA]">PulseCX Staff Console</span>
                  <span className="text-[10px] font-semibold text-emerald-400 bg-emerald-950/40 border border-emerald-800/50 px-1.5 py-0.5 rounded">
                    ● DESK LIVE
                  </span>
                </div>
                <div className="text-[11px] text-[#8B939C]">Officer: <strong className="text-[#E8EBEF]">Marcus Vance</strong> (Senior Manager • Ext 401)</div>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <button
                onClick={() => setCredentialModalOpen(true)}
                className="saas-btn-secondary text-xs px-3 py-1.5 flex items-center gap-1.5"
              >
                <Icons.Key className="w-3.5 h-3.5 text-[#8B939C]" />
                <span>Credentials</span>
              </button>

              <a
                href="/"
                className="saas-btn-secondary text-xs px-3 py-1.5 flex items-center gap-1.5"
              >
                <Icons.ArrowLeft className="w-3.5 h-3.5 text-[#8B939C]" />
                <span>Customer Portal</span>
              </a>

              <button
                onClick={() => setIsAuthenticated(false)}
                className="saas-btn-secondary text-xs px-3 py-1.5 text-red-400 hover:text-red-300 flex items-center gap-1.5"
              >
                <Icons.LogOut className="w-3.5 h-3.5" />
                <span>Lock Console</span>
              </button>
            </div>
          </header>

          {/* Main Dashboard Body */}
          <main className="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6 relative z-10">
            
            {/* Top KPI Metrics Bar */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div className="saas-card p-4 bg-[#101318] space-y-1">
                <div className="text-[11px] font-semibold text-[#8B939C] uppercase">Registered Accounts</div>
                <div className="text-2xl font-bold text-[#F5F7FA]">{customers.length} Accounts</div>
                <div className="text-[11px] text-emerald-400">100% Identity Verified</div>
              </div>

              <div className="saas-card p-4 bg-[#101318] space-y-1">
                <div className="text-[11px] font-semibold text-[#8B939C] uppercase">Active Shipments</div>
                <div className="text-2xl font-bold text-[#F5F7FA]">3 In-Transit</div>
                <div className="text-[11px] text-[#8B939C]">GNSS Precision: ±1.2m</div>
              </div>

              <div className="saas-card p-4 bg-[#101318] space-y-1">
                <div className="text-[11px] font-semibold text-[#8B939C] uppercase">SLA Resolution Rate</div>
                <div className="text-2xl font-bold text-[#F5F7FA]">99.8%</div>
                <div className="text-[11px] text-emerald-400">Avg Response: 4m 12s</div>
              </div>

              <div className="saas-card p-4 bg-[#101318] space-y-1">
                <div className="text-[11px] font-semibold text-[#8B939C] uppercase">Executive Guarantee</div>
                <div className="text-2xl font-bold text-[#F5F7FA]">$0 Dispute Loss</div>
                <div className="text-[11px] text-[#8B939C]">30-Day Money Back</div>
              </div>
            </div>

            {/* Split Screen Layout: Customer Registry + Management Terminal */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              
              {/* Left Column (2 Cols): Registered Customers Database Table */}
              <div className="lg:col-span-2 saas-card bg-[#101318] p-6 space-y-4">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <h2 className="text-base font-bold text-[#F5F7FA]">Verified Customer Directory</h2>
                    <p className="text-xs text-[#8B939C]">Click a customer to inspect active hardware warranties and dispatch messages.</p>
                  </div>

                  <div className="relative">
                    <Icons.Search className="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-[#8B939C]" />
                    <input
                      type="text"
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      placeholder="Filter directory..."
                      className="saas-input pl-8 pr-3 py-1.5 text-xs text-[#F5F7FA] w-48"
                    />
                  </div>
                </div>

                {/* Customer Table */}
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="border-b border-[#242A31] text-[#8B939C]">
                        <th className="py-2.5 font-semibold">Customer</th>
                        <th className="py-2.5 font-semibold">Tier</th>
                        <th className="py-2.5 font-semibold">Contact</th>
                        <th className="py-2.5 font-semibold">Active Shipment</th>
                        <th className="py-2.5 font-semibold">Hardware</th>
                        <th className="py-2.5 font-semibold text-right">Select</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-[#242A31]">
                      {filteredCustomers.map(c => {
                        const isSelected = selectedCustomer?.id === c.id;
                        return (
                          <tr 
                            key={c.id} 
                            onClick={() => setSelectedCustomer(c)}
                            className={`cursor-pointer transition ${isSelected ? 'bg-[#171B20]' : 'hover:bg-[#14181D]'}`}
                          >
                            <td className="py-3 font-semibold text-[#F5F7FA]">
                              <div>{c.firstName} {c.surname}</div>
                              <div className="text-[10px] text-[#8B939C] font-mono">{c.id}</div>
                            </td>
                            <td className="py-3">
                              <span className="text-[10px] font-semibold text-[#E8EBEF] bg-[#14181D] border border-[#242A31] px-2 py-0.5 rounded">
                                {c.membershipTier}
                              </span>
                            </td>
                            <td className="py-3 text-[#8B939C]">
                              <div>{c.phone}</div>
                              <div className="text-[10px] text-[#69717B]">{c.email}</div>
                            </td>
                            <td className="py-3 font-mono font-medium text-[#F5F7FA]">
                              {c.activeShipmentId}
                            </td>
                            <td className="py-3 text-[#E8EBEF]">
                              {c.registeredDevices.length} Device(s)
                            </td>
                            <td className="py-3 text-right">
                              <button className={`text-xs font-semibold px-2.5 py-1 rounded ${isSelected ? 'bg-[#F1F3F5] text-[#090B0D]' : 'saas-btn-secondary'}`}>
                                {isSelected ? 'Active' : 'Inspect'}
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>

                {/* Selected Customer Detailed Assets */}
                {selectedCustomer && (
                  <div className="p-4 rounded-xl bg-[#14181D] border border-[#242A31] space-y-3 mt-4">
                    <div className="flex items-center justify-between border-b border-[#242A31] pb-2">
                      <div className="text-xs font-bold text-[#F5F7FA]">
                        Hardware Assets: {selectedCustomer.firstName} {selectedCustomer.surname}
                      </div>
                      <span className="text-[11px] text-[#8B939C]">Customer Since {new Date(selectedCustomer.registeredAt).toLocaleDateString()}</span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {selectedCustomer.registeredDevices.map((dev, idx) => (
                        <div key={idx} className="p-3 bg-[#101318] rounded-lg border border-[#242A31] text-xs space-y-1">
                          <div className="font-semibold text-[#F5F7FA] flex justify-between">
                            <span>{dev.modelName}</span>
                            <span className="text-[10px] text-emerald-400 bg-emerald-950/40 border border-emerald-800/50 px-1.5 py-0.2 rounded font-normal">● {dev.warrantyStatus}</span>
                          </div>
                          <div className="text-[11px] text-[#8B939C]">Serial: <strong className="font-mono text-[#E8EBEF]">{dev.serialNumber}</strong></div>
                          <div className="text-[11px] text-[#8B939C]">Coverage: {dev.warrantyExpires}</div>
                          <div className="text-[11px] text-[#8B939C]">Health: {dev.healthStatus}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>

              {/* Right Column (1 Col): Dispatch & Message Terminal */}
              <div className="saas-card bg-[#101318] p-6 space-y-4 flex flex-col justify-between">
                <div className="space-y-3">
                  <div>
                    <h3 className="text-sm font-bold text-[#F5F7FA]">Executive Dispatch Terminal</h3>
                    <p className="text-xs text-[#8B939C]">Broadcast real-time status updates directly to recipient devices.</p>
                  </div>

                  {selectedCustomer ? (
                    <div className="p-3 rounded-lg bg-[#14181D] border border-[#242A31] text-xs space-y-1">
                      <div className="text-[10px] text-[#8B939C] uppercase font-semibold">Active Recipient</div>
                      <div className="font-bold text-[#F5F7FA]">{selectedCustomer.firstName} {selectedCustomer.surname}</div>
                      <div className="text-[11px] text-[#8B939C] font-mono">{selectedCustomer.phone} • {selectedCustomer.activeShipmentId}</div>
                    </div>
                  ) : (
                    <div className="text-xs text-[#8B939C]">Select a customer from directory.</div>
                  )}

                  {/* Canned Quick Actions */}
                  <div className="space-y-1.5 pt-2">
                    <div className="text-[10px] font-semibold uppercase text-[#8B939C]">Canned Telemetry Dispatches</div>
                    <button
                      onClick={() => handleQuickDispatch("Courier van is 3.8 miles away on route #14. On schedule for 4:30 PM delivery.")}
                      className="w-full text-left p-2 rounded-md bg-[#14181D] hover:bg-[#171B20] border border-[#242A31] text-xs text-[#E8EBEF] transition"
                    >
                      "Courier is 3.8 miles away on route #14 (4:30 PM ETA)"
                    </button>
                    <button
                      onClick={() => handleQuickDispatch("Prepaid return label generated and emailed. 100% refund authorized.")}
                      className="w-full text-left p-2 rounded-md bg-[#14181D] hover:bg-[#171B20] border border-[#242A31] text-xs text-[#E8EBEF] transition"
                    >
                      "Prepaid return label generated & 100% refund approved"
                    </button>
                    <button
                      onClick={() => handleQuickDispatch("Advance hardware warranty replacement dispatched with tracking.")}
                      className="w-full text-left p-2 rounded-md bg-[#14181D] hover:bg-[#171B20] border border-[#242A31] text-xs text-[#E8EBEF] transition"
                    >
                      "Advance warranty hardware replacement dispatched"
                    </button>
                  </div>

                  {/* Custom Message Input */}
                  <form onSubmit={handleCustomDispatch} className="space-y-2 pt-2">
                    <div className="text-[10px] font-semibold uppercase text-[#8B939C]">Custom Desk Dispatch</div>
                    <textarea
                      rows="2"
                      value={dispatchMessage}
                      onChange={(e) => setDispatchMessage(e.target.value)}
                      placeholder="Type custom notification..."
                      className="w-full saas-input p-2.5 text-xs text-[#F5F7FA]"
                    />
                    <button
                      type="submit"
                      disabled={!selectedCustomer}
                      className="w-full saas-btn-primary py-2 text-xs flex items-center justify-center gap-1.5"
                    >
                      <Icons.Send className="w-3.5 h-3.5" />
                      <span>Transmit Dispatch Update</span>
                    </button>
                  </form>
                </div>

                {/* Dispatch Activity Logs */}
                <div className="pt-4 border-t border-[#242A31] space-y-2">
                  <div className="text-[10px] font-semibold uppercase text-[#8B939C]">Recent Transmissions</div>
                  <div className="space-y-2 max-h-32 overflow-y-auto">
                    {dispatchLogs.map(log => (
                      <div key={log.id} className="p-2 rounded bg-[#14181D] border border-[#242A31] text-[11px] space-y-0.5">
                        <div className="flex justify-between font-semibold text-[#F5F7FA]">
                          <span>To: {log.to}</span>
                          <span className="font-mono font-normal text-[#8B939C]">{log.time}</span>
                        </div>
                        <p className="text-[#8B939C]">{log.text}</p>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>

          </main>

          {/* Credentials Popover Modal */}
          {credentialModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn">
              <div className="saas-card p-6 bg-[#101318] border border-[#242A31] max-w-sm w-full space-y-4 shadow-modal">
                <div className="flex items-center justify-between border-b border-[#242A31] pb-3">
                  <h3 className="font-bold text-sm text-[#F5F7FA]">Staff Credentials Overview</h3>
                  <button onClick={() => setCredentialModalOpen(false)} className="text-[#8B939C] hover:text-[#F5F7FA]">
                    <Icons.X className="w-4 h-4" />
                  </button>
                </div>
                <div className="text-xs text-[#8B939C] space-y-2">
                  <div className="p-2.5 rounded-lg bg-[#14181D] border border-[#242A31]">
                    <div className="font-semibold text-[#F5F7FA]">Senior Service Manager</div>
                    <div>Username: <strong className="font-mono text-[#E8EBEF]">marcus.vance</strong></div>
                    <div>PIN: <strong className="font-mono text-[#E8EBEF]">8842</strong></div>
                  </div>
                  <div className="p-2.5 rounded-lg bg-[#14181D] border border-[#242A31]">
                    <div className="font-semibold text-[#F5F7FA]">Master Admin</div>
                    <div>Username: <strong className="font-mono text-[#E8EBEF]">admin</strong></div>
                    <div>PIN: <strong className="font-mono text-[#E8EBEF]">admin123</strong></div>
                  </div>
                </div>
                <button
                  onClick={() => setCredentialModalOpen(false)}
                  className="w-full saas-btn-primary py-2 text-xs"
                >
                  Close
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
  </script>
</body>
</html>
